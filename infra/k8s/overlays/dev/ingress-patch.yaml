apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas
  namespace: saas
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-2:000000000000:certificate/REPLACE-ME
spec:
  rules:
    - host: dev.saas.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: saas-api
                port: { number: 80 }
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: saas-api
                port: { number: 80 }
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: saas-api
                port: { number: 80 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saas-web
                port: { number: 80 }
