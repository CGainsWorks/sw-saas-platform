apiVersion: v1
kind: ServiceAccount
metadata:
  name: saas-api
  namespace: saas
  annotations:
    # From `terraform output api_irsa_role_arn`. The role's trust policy names this exact
    # namespace and service account, so a mismatch fails closed with an AssumeRole error
    # rather than silently granting nothing.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/saas-dev-api
