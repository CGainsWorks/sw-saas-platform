apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: saas

resources:
  - ../../base

nameSuffix: ''

commonAnnotations:
  environment: dev

# Two replicas is already the base. Dev drops to one of each: this cluster runs on two
# small spot nodes, and the PodDisruptionBudget plus topology spread would otherwise leave
# pods Pending.
replicas:
  - name: saas-api
    count: 1
  - name: saas-web
    count: 1

patches:
  - path: configmap-patch.yaml
  - path: serviceaccount-patch.yaml
  - path: ingress-patch.yaml

images:
  - name: ghcr.io/cgainsworks/sw-saas-platform-api
    newTag: dev
  - name: ghcr.io/cgainsworks/sw-saas-platform-web
    newTag: dev
