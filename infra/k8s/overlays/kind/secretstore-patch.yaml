# Swap IRSA (jwt) for static keys. Region, service and every remoteRef stay as in base.
- op: replace
  path: /spec/provider/aws/auth
  value:
    secretRef:
      accessKeyIDSecretRef:
        name: localstack-credentials
        key: access-key-id
      secretAccessKeySecretRef:
        name: localstack-credentials
        key: secret-access-key
