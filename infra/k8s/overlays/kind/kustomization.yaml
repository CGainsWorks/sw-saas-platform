# The dev overlay, unchanged, plus the one thing a kind cluster cannot supply: an IAM role.
#
# On EKS the SecretStore authenticates to Secrets Manager with the pod's IRSA token. In
# kind there is no IAM, so the SecretStore is pointed at static credentials instead and
# the External Secrets Operator is pointed at LocalStack (see scripts/kind/up.sh). Every
# other object is exactly what `kubectl kustomize infra/k8s/overlays/dev` renders,
# including the ExternalSecret, the NetworkPolicies and the restricted namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: saas

resources:
  - ../dev
  - localstack-credentials.yaml

patches:
  - target:
      group: external-secrets.io
      kind: SecretStore
      name: aws-secrets
    path: secretstore-patch.yaml
