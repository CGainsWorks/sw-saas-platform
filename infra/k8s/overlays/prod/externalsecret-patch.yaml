apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: saas-api-secrets
  namespace: saas
spec:
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: saas-prod/app, property: DATABASE_URL }
    - secretKey: DATABASE_ADMIN_URL
      remoteRef: { key: saas-prod/app, property: DATABASE_ADMIN_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: saas-prod/app, property: REDIS_URL }
    - secretKey: JWT_PRIVATE_KEY_B64
      remoteRef: { key: saas-prod/app, property: JWT_PRIVATE_KEY_B64 }
    - secretKey: JWT_PUBLIC_KEY_B64
      remoteRef: { key: saas-prod/app, property: JWT_PUBLIC_KEY_B64 }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: saas-prod/app, property: OIDC_CLIENT_SECRET }
