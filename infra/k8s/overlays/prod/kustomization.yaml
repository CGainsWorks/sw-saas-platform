apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: saas

resources:
  - ../../base

commonAnnotations:
  environment: prod

replicas:
  - name: saas-api
    count: 3
  - name: saas-web
    count: 2

patches:
  - path: configmap-patch.yaml
  - path: serviceaccount-patch.yaml
  - path: ingress-patch.yaml
  - path: resources-patch.yaml
  - path: externalsecret-patch.yaml

images:
  # CI replaces these with the immutable digest of the image it built and tested, so a
  # rollout cannot pick up a different image than the one that passed the pipeline.
  - name: ghcr.io/cgainsworks/sw-saas-platform-api
    newTag: prod
  - name: ghcr.io/cgainsworks/sw-saas-platform-web
    newTag: prod
