# Pulls application secrets from AWS Secrets Manager into a Kubernetes Secret.
#
# Requires the External Secrets Operator to be installed in the cluster (see
# docs/runbook.md). The point of the indirection: secret VALUES never appear in this
# repository, in a manifest, or in `kubectl apply` output. What is committed is a
# reference — the name of a secret and the fields to read from it.
#
# Authentication is via the pod's IRSA role, so the operator can read exactly the secret
# ARNs named in the EKS module's IAM policy and nothing else.
#
# Exercised on kind against LocalStack Secrets Manager (infra/k8s/overlays/kind), where
# only the SecretStore auth block is replaced. Uses the v1 API, which the operator
# version pinned there (infra/k8s/kind/versions.env) serves.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: saas
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: saas-api
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: saas-api-secrets
  namespace: saas
spec:
  # Re-reads every 15 minutes, so a rotation in Secrets Manager propagates without a
  # deploy. Note the pods do not restart on change — the API reads config at boot, so a
  # rotated credential needs a rollout to take effect. Documented in the runbook rather
  # than papered over with a reloader sidecar.
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: saas-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: saas-dev/app, property: DATABASE_URL }
    # Master credential, used by the migration Job only. It is in the same Secret because
    # both workloads share a ServiceAccount; the separation that matters is that the API
    # process reads DATABASE_URL and never DATABASE_ADMIN_URL on a request path.
    - secretKey: DATABASE_ADMIN_URL
      remoteRef: { key: saas-dev/app, property: DATABASE_ADMIN_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: saas-dev/app, property: REDIS_URL }
    - secretKey: JWT_PRIVATE_KEY_B64
      remoteRef: { key: saas-dev/app, property: JWT_PRIVATE_KEY_B64 }
    - secretKey: JWT_PUBLIC_KEY_B64
      remoteRef: { key: saas-dev/app, property: JWT_PUBLIC_KEY_B64 }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: saas-dev/app, property: OIDC_CLIENT_SECRET }
