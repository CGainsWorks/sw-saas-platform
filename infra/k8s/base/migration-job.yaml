# Schema migrations, run as a Job before the API rolls out.
#
# Two things make this safe to run on every deploy:
#
#   1. The runner is forward-only and idempotent. Already-applied migrations are skipped
#      after a checksum check, so re-running is a no-op.
#   2. It takes a Postgres advisory lock, so N concurrent Jobs (a re-apply, a retry, two
#      pipelines racing) serialise instead of corrupting each other.
#
# It runs as the MASTER user, not app_user. Migrations create roles, alter policies and
# grant privileges — none of which app_user can do, by design. That separation is the
# reason a compromised API pod cannot alter its own isolation policies.
apiVersion: batch/v1
kind: Job
metadata:
  name: saas-migrate
  namespace: saas
  annotations:
    # Replaced on each deploy by the pipeline, since a Job's pod template is immutable.
    deploy/revision: 'REPLACED_BY_CI'
spec:
  backoffLimit: 3
  # Clean up an hour after finishing, so completed Jobs do not accumulate.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: saas-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/cgainsworks/sw-saas-platform-api:latest
          command: ['node', 'dist/db/migrate.js']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          env:
            - name: NODE_ENV
              value: production
            # The migrator needs the master credential. DATABASE_URL is still required by
            # config validation, so both are supplied; only the admin one is used here.
            - name: DATABASE_ADMIN_URL
              valueFrom:
                secretKeyRef: { name: saas-api-secrets, key: DATABASE_ADMIN_URL }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: saas-api-secrets, key: DATABASE_URL }
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: saas-api-secrets, key: REDIS_URL }
            - name: JWT_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef: { name: saas-api-secrets, key: JWT_PRIVATE_KEY_B64 }
            - name: JWT_PUBLIC_KEY_B64
              valueFrom:
                secretKeyRef: { name: saas-api-secrets, key: JWT_PUBLIC_KEY_B64 }
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: saas-api-secrets, key: OIDC_CLIENT_SECRET }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
