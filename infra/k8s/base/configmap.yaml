apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-api-config
  namespace: saas
data:
  # Non-secret configuration only. Anything sensitive comes from the Secret that External
  # Secrets syncs out of AWS Secrets Manager — see externalsecret.yaml.
  #
  # These are the base values; each overlay patches the hostnames for its environment.
  JWT_ISSUER: https://api.saas.example.com
  JWT_AUDIENCE: saas-api
  ACCESS_TOKEN_TTL_SECONDS: '900'
  REFRESH_TOKEN_TTL_SECONDS: '1209600'

  OIDC_ISSUER: https://auth.saas.example.com
  OIDC_CLIENT_ID: saas-web
  OIDC_REDIRECT_URI: https://api.saas.example.com/v1/auth/callback

  WEB_ORIGIN: https://saas.example.com

  # Pool size per replica. Multiply by replica count and compare against the RDS
  # max_connections before raising it — the pooled tenancy model means every replica
  # shares one database, and exhausting its connections is an outage for every tenant.
  PGPOOL_MAX: '10'
  PG_STATEMENT_TIMEOUT_MS: '10000'

  RATE_LIMIT_MAX: '300'
  RATE_LIMIT_WINDOW_MS: '60000'

  GRAPHQL_MAX_DEPTH: '10'
  # Introspection is off outside dev: useful for developers, equally useful for mapping
  # the attack surface.
  GRAPHQL_INTROSPECTION: 'false'
