apiVersion: v1
kind: ServiceAccount
metadata:
  name: saas-api
  namespace: saas
  annotations:
    # Bound to the IRSA role from the EKS module, whose trust policy names this exact
    # namespace/serviceaccount pair with StringEquals. Patched per environment.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/saas-dev-api
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saas-web
  namespace: saas
# The front end talks only to the API and needs no AWS permissions, so it gets no IRSA
# annotation and no projected token. A pod that cannot call the AWS API cannot be used to
# reach the database credentials.
automountServiceAccountToken: false
