apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saas-api
  namespace: saas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saas-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # React quickly to load, but not to a single spiky sample.
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # Scale down slowly. Aggressive scale-down causes flapping, and in a pooled tenancy
      # model every replica removal also drops its share of database connections, so
      # oscillating replica counts churn the connection pool as well.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saas-web
  namespace: saas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saas-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
# Without a PDB, a node drain (an upgrade, a spot reclaim, a cluster autoscaler
# consolidation) can evict every replica at once. `minAvailable: 1` makes the drain wait.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: saas-api
  namespace: saas
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: saas-web
  namespace: saas
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saas-web
