# Overrides for the load test (loadtest/run.sh). Layered on the demo compose file:
#
#   docker compose -f docker-compose.yml -f loadtest/compose.loadtest.yml up -d --wait api
#
# Runs the API the way the cluster does (NODE_ENV=production, JSON logs at info) with a
# fixed signing key, so loadtest/mint-token.mjs can issue a token the API accepts. The
# rate limit is raised because every virtual user shares one tenant, and the point is to
# measure the request path rather than the limiter's 429s.
services:
  api:
    environment:
      NODE_ENV: production
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?run loadtest/run.sh, which generates it}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?run loadtest/run.sh, which generates it}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?run loadtest/run.sh, which generates it}
      RATE_LIMIT_MAX: '1000000'
