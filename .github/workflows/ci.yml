name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch. Saves minutes and stops a stale run from
# reporting after a newer commit has already been checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Everything imports its compiled output, so this has to come first.
      - name: Build shared-types
        run: npm run build --workspace @saas/shared-types

      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces --if-present

  test:
    name: Tests (incl. tenant isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real PostgreSQL and real Redis. The isolation suite is meaningless against a mock:
    # what is under test is whether Postgres row-level security actually behaves the way
    # the design assumes, and a test double would only assert that I mocked it correctly.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://app_user:app_dev_password@localhost:5433/saas
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5433/saas
      REDIS_URL: redis://localhost:6380
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @saas/shared-types

      # The compose setup creates this via a container init script, which GitHub's service
      # containers do not run. Migration 0002 would create the role anyway, but without a
      # password — so the application could not log in.
      - name: Create the least-privilege application role
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d saas -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE app_user LOGIN PASSWORD 'app_dev_password'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT;
          SQL

      - name: Migrate
        run: npm run migrate

      - name: Run the full test suite
        run: npm test

      # A passing suite proves little on its own — it might pass because the assertions
      # are vacuous. This disables RLS on each tenant-owned table in turn and asserts the
      # tests go RED, then restores it. If someone adds a table without an attack test,
      # this fails.
      - name: Verify the isolation tests actually detect a missing policy
        run: node scripts/verify-isolation.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: apps/api/test-results/
          if-no-files-found: ignore

  build-images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck]
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, dev-idp]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — no push and no registry credentials. A pull request from a fork must
      # never be able to publish an image.
      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      # `validate` catches syntax and type errors without contacting AWS, so it needs no
      # credentials and costs nothing. It cannot catch everything a plan would.
      - name: terraform validate
        run: |
          for dir in infra/terraform/envs/*/; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - name: Build kustomize overlays
        run: |
          for overlay in infra/k8s/overlays/*/; do
            echo "==> $overlay"
            kubectl kustomize "$overlay" > /dev/null
          done

      - name: Check Prometheus rules parse
        run: |
          docker run --rm -v "$PWD/observability:/o" \
            --entrypoint promtool prom/prometheus:v2.55.1 check rules /o/alerts/api.rules.yml

  kind:
    name: Kubernetes on kind (Calico, External Secrets, LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck]
    # Runs the dev overlay on a real cluster: kind with Calico so NetworkPolicies are
    # enforced, the External Secrets Operator syncing from LocalStack Secrets Manager, the
    # migration Job, then the isolation suites against the in-cluster API. Every version
    # is pinned in infra/k8s/kind/versions.env, which scripts/kind/*.sh read as well.
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned versions
        run: grep -E '^[A-Z_]+=' infra/k8s/kind/versions.env >> "$GITHUB_ENV"

      - uses: helm/kind-action@v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          install_only: true

      - uses: azure/setup-helm@v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @saas/shared-types

      - uses: docker/setup-buildx-action@v3

      # Built here and loaded into the node, never pulled: the cluster runs exactly the
      # images this commit produces. The layer cache is the one the build-images job fills.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ghcr.io/cgainsworks/sw-saas-platform-api:dev
          cache-from: type=gha,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ghcr.io/cgainsworks/sw-saas-platform-web:dev
          cache-from: type=gha,scope=web

      - name: Create the cluster and deploy the dev overlay
        run: scripts/kind/up.sh
        env:
          SKIP_BUILD: '1'

      - name: Prove the NetworkPolicies are enforced
        run: scripts/kind/netpol-check.sh

      - name: Isolation tests against the in-cluster API
        run: scripts/kind/isolation-tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-kind
          path: apps/api/test-results/
          if-no-files-found: ignore

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Fails the build on a high or critical advisory with a fix available. Lower
      # severities are reported but do not block — a policy that blocks on everything
      # gets switched off within a month.
      - name: npm audit
        run: npm audit --audit-level=high

      - name: Scan the filesystem for vulnerabilities and secrets
        # Pinned to the commit behind the v0.36.0 tag rather than the tag itself: a tag
        # can be moved to point at different code, a commit SHA cannot.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '0' # report, do not block; findings land in the Security tab

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
