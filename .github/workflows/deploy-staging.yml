name: Deploy staging

# Manual only. No AWS account is connected to this repository, so the deploy role secret
# does not exist and the target cluster is not running. Triggering on every push to main
# would only produce a red run. Run it by hand once the infrastructure and the
# AWS_DEPLOY_ROLE_ARN secret are in place.
on:
  workflow_dispatch:

concurrency:
  # No cancel-in-progress. Cancelling a deploy mid-rollout leaves the cluster in a state
  # nobody chose; queueing is the safe behaviour.
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # required for OIDC federation to AWS

env:
  REGISTRY: ghcr.io
  # Container registries require lower-case repository names and github.repository keeps
  # the owner's capitals. Expressions have no lower() function, so the name is spelt out;
  # it matches the image names in infra/k8s.
  IMAGE_PREFIX: ghcr.io/cgainsworks/sw-saas-platform
  AWS_REGION: eu-west-2
  CLUSTER: saas-dev
  NAMESPACE: saas

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:dev
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://dev.saas.example.com
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:dev
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to dev cluster
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: staging
      url: https://dev.saas.example.com
    steps:
      - uses: actions/checkout@v4

      # Short-lived credentials via OIDC. No long-lived AWS access keys are stored as
      # repository secrets — a leaked key is valid until someone notices; a leaked OIDC
      # token expires in an hour and is scoped to this repository and branch.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-staging-${{ github.run_id }}

      - name: Get cluster credentials
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER }} --region ${{ env.AWS_REGION }}

      # Pin to the digest, not the tag. A tag is mutable — between the build and the
      # rollout it could point somewhere else. The digest is the exact artefact CI tested.
      - name: Pin images by digest
        working-directory: infra/k8s/overlays/dev
        run: |
          kubectl kustomize . > /dev/null  # fail fast if the overlay is broken
          kustomize edit set image \
            ghcr.io/cgainsworks/sw-saas-platform-api=${{ env.IMAGE_PREFIX }}-api@${{ needs.build-and-push.outputs.api_digest }} \
            ghcr.io/cgainsworks/sw-saas-platform-web=${{ env.IMAGE_PREFIX }}-web@${{ needs.build-and-push.outputs.web_digest }}

      # Migrations run to completion BEFORE the new pods roll out. The runner is
      # forward-only, checksummed and takes an advisory lock, so a retry is a no-op and
      # two concurrent runs serialise.
      - name: Run migrations
        run: |
          # A Job's pod template is immutable, so the previous run has to be removed
          # before the same name can be reused.
          kubectl delete job saas-migrate -n ${{ env.NAMESPACE }} --ignore-not-found
          kubectl apply -n ${{ env.NAMESPACE }} -f <(kubectl kustomize infra/k8s/overlays/dev | \
            yq 'select(.kind == "Job")')
          kubectl wait --for=condition=complete job/saas-migrate \
            -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Show migration output
        if: always()
        run: kubectl logs job/saas-migrate -n ${{ env.NAMESPACE }} --tail=100 || true

      - name: Apply manifests
        run: kubectl apply -k infra/k8s/overlays/dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/saas-api -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/saas-web -n ${{ env.NAMESPACE }} --timeout=300s

      # The same end-to-end script used locally, now against the deployed environment.
      # It drives a real OAuth2 flow and replays the cross-tenant attacks over HTTP.
      - name: Smoke test
        env:
          API_URL: https://dev.saas.example.com
          WEB_URL: https://dev.saas.example.com
          IDP_URL: https://auth.dev.saas.example.com
        run: node scripts/smoke-test.mjs

      # An automatic rollback, because a failed smoke test means the new version is
      # serving and broken. Undoing it is strictly better than leaving it up while someone
      # is found.
      - name: Roll back on failure
        if: failure()
        run: |
          echo "::error::Deploy failed. Rolling back."
          kubectl rollout undo deployment/saas-api -n ${{ env.NAMESPACE }} || true
          kubectl rollout undo deployment/saas-web -n ${{ env.NAMESPACE }} || true
          kubectl rollout status deployment/saas-api -n ${{ env.NAMESPACE }} --timeout=180s || true
